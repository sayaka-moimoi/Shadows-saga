<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows Saga - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2.1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-icon:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    /* 【確定仕様】上部は全ページ共通で「赤字の巻タイトル」のみ！章名は完全削除 */
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 1.35rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0;
    }

    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }

    /* 小説エリア */
    .novel-body {
      font-size: 1.05rem;
      letter-spacing: 0.05em;
    }
    /* 【確定仕様】小説の章タイトル：黄色（ゴールド）で大きく！ */
    .novel-chapter-heading {
      font-size: 1.35rem;
      color: var(--accent-gold);
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    /* 本文：さやかさんの改行・空行を100%完全維持（白文字） */
    .novel-paragraph {
      white-space: pre-wrap;
      color: var(--text-color);
      margin-bottom: 1.5em;
    }
    /* 目次トップ：プロローグ詩（白文字・センタリング） */
    .novel-centered {
      text-align: center;
      white-space: pre-wrap;
      color: var(--text-color);
      font-size: 1.05rem;
      line-height: 2.3;
      margin: 25px 0 35px;
    }
    /* 赤枠ボックス（次回予告 ＆ 2巻あおり） */
    .preview-box {
      margin-top: 35px;
      padding: 18px;
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      font-size: 0.92rem;
      color: #ccc;
      white-space: pre-wrap;
    }
    .lead-box {
      margin-bottom: 30px;
      padding: 18px;
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      font-size: 0.95rem;
      color: var(--accent-gold);
      white-space: pre-wrap;
    }

    /* 歌詞エリア */
    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
      font-size: 1rem;
      line-height: 2.2;
      color: #ccc;
      text-align: center;
    }
    .lyric-card-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
    }
    /* 【確定仕様】曲タイトル：黄色（ゴールド） */
    .lyric-song-title {
      font-size: 1.3rem;
      color: var(--accent-gold);
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .lyric-main-text {
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 2.2;
    }

    .omake-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .omake-btn {
      background: #1e1e28;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .omake-btn.active {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }
    .bottom-section {
      margin-top: 45px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .btn-return-toc {
      background: var(--panel-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: sans-serif;
      font-weight: bold;
    }
    .link-list-card {
      margin-top: 25px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .link-list-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .link-item-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .link-item-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #1d1d28;
    }
    .link-item-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--accent-gold);
      font-family: sans-serif;
    }
    .toc-container { flex: 1; overflow-y: auto; padding: 10px 0; font-family: sans-serif; }
    .accordion-header {
      padding: 14px 20px;
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }
    .accordion-content { display: none; list-style: none; }
    .accordion-content.open { display: block; }
    .toc-item {
      padding: 10px 20px 10px 30px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .toc-item:hover, .toc-item.active {
      background: var(--panel-bg);
      color: var(--accent-gold);
      border-left: 3px solid var(--accent-gold);
    }
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; z-index: 150; }
    .overlay.open { display: block; }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 17, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      z-index: 90;
    }
    .nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>

  <header>
    <div class="brand-title" onclick="loadChapter(0)">SHADOWS SAGA</div>

      <button class="btn-icon" onclick="toggleFontSize()">文字: <span id="font-size-label">中</span></button>
      <button class="btn-icon" onclick="toggleSidebar()">目次 ☰</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>目次一覧</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="toc-container" id="accordion-toc"></div>
  </aside>

  <main>
    <!-- 【確定仕様】上部は「赤字の巻タイトル」のみ常時表示 -->
    <div class="chapter-header">
      <div class="volume-tag" id="vol-tag">第１巻：Dawn Beyond Shadows</div>
    </div>

    <div class="audio-card">
      <div class="audio-info">
        <div class="audio-title-wrap">
          <span class="audio-badge">BGM</span>
          <span class="audio-song-name" id="song-name">曲名</span>
        </div>
        <span class="no-audio-msg" id="audio-status"></span>
      </div>
      <audio id="audio-player" controls preload="metadata" src=""></audio>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tab-book" onclick="switchView('book')">📖 小説 (Book)</button>
      <button class="tab-btn" id="tab-lyric" onclick="switchView('lyric')">📜 歌詞 (Lyric)</button>
    </div>

    <!-- 小説エリア -->
    <div class="view-content active" id="content-book">
      <article class="novel-body" id="novel-text"></article>
      <!-- 目次ページ時：プロローグ詩の直下に章一覧リンク復活！ -->
      <div class="link-list-card" id="top-chapter-portal" style="display: none;">
        <div class="link-list-header">📖 章一覧（タップで直接読む）</div>
        <div class="link-grid" id="chapter-grid"></div>
      </div>
      <div class="bottom-section" id="book-footer">
        <button class="btn-return-toc" id="btn-toc-target" onclick="returnToVolumeToc()">📑 目次に戻る</button>
      </div>
    </div>

    <!-- 歌詞エリア -->
    <div class="view-content" id="content-lyric">
      <div class="omake-selector" id="omake-selector" style="display: none;"></div>
      <div class="lyrics-body" id="lyrics-text"></div>
      <div class="link-list-card" id="tracklist-container">
        <div class="link-list-header" style="color: var(--accent-red);">💿 収録曲リスト（タップで移動）</div>
        <div class="link-grid" id="track-grid"></div>
      </div>
    </div>
  </main>

  <div class="footer-nav">

        isOmake: true,

          { name: "- 縁 -", file: "v2_omake_1.txt", mp3: "" },
          { name: "光と影のビート", file: "v2_omake_2.txt", mp3: "" },

      // ----------------- 外伝 -----------------
      { vol: "外伝シリーズ", title: "外伝1『蛍丸』", song: "Fading Light ~mark-metal~", mp3: "", novelFile: "gaiden_01.txt", lyricFile: "gaiden_01.txt", topIndex: 0 },

      { vol: "巻末アーカイブ：AI徹底考察", title: "考察②：カニの変遷と奇跡", song: "斬光の宴", mp3: "", novelFile: "review_02.txt", lyricFile: "review_02.txt", topIndex: 0 }

    let currentIndex = 0;
    let currentView = 'book';
    const fontSizes = ["0.95rem", "1.05rem", "1.2rem"];
    const fontSizeLabels = ["小", "中", "大"];
    let currentFontSizeIdx = 1;

    // 小説パース処理
    function parseNovelText(rawText, ch) {
      if (!rawText) return "<p>（本文がありません）</p>";

      // 目次ページ：白文字でセンタリング！
      if (ch.isTop) {
        return `<div class="novel-centered">${rawText.trim()}</div>`;
      }

      const parts = rawText.split(/\n\s*---\s*\n/);
      if (parts.length < 2) {
        return `<div class="novel-paragraph">${rawText.trim()}</div>`;
      }

      let html = "";
      const isVol2 = ch.vol.includes("第２巻");

      // 【確定仕様】章タイトルは黄色（ゴールド）！
      if (!isVol2) {
        if (parts[0] && parts[0].trim()) html += `<div class="novel-chapter-heading">${parts[0].trim()}</div>`;
        if (parts[1] && parts[1].trim()) html += `<div class="novel-paragraph">${parts[1].trim()}</div>`;
        if (parts[2] && parts[2].trim()) html += `<div class="preview-box">${parts[2].trim()}</div>`;
      } else {
        if (parts[0] && parts[0].trim()) html += `<div class="novel-chapter-heading">${parts[0].trim()}</div>`;
        if (parts[1] && parts[1].trim()) html += `<div class="lead-box">${parts[1].trim()}</div>`;
        if (parts[2] && parts[2].trim()) html += `<div class="novel-paragraph">${parts[2].trim()}</div>`;
      }
      return html;
    }

    // 歌詞パース処理
    function parseLyricText(rawText) {
      if (!rawText) return "（歌詞がありません）";
      const parts = rawText.split(/\n\s*---\s*\n/);
      if (parts.length < 2) {
        return `<div class="lyric-main-text">${rawText.trim()}</div>`;
      }
      let html = "";
      if (parts[0] && parts[0].trim()) html += `<div class="lyric-card-label">${parts[0].trim()}</div>`;
      // 【確定仕様】曲タイトルは黄色（ゴールド）！
      if (parts[1] && parts[1].trim()) html += `<div class="lyric-song-title">${parts[1].trim()}</div>`;
      if (parts[2] && parts[2].trim()) html += `<div class="lyric-main-text">${parts[2].trim()}</div>`;
      return html;
    }

    async function fetchText(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Not Found");
        return await res.text();
      } catch (err) {
        return `⚠️ テキストファイル（${path}）がまだアップロードされていません。GitHubの該当フォルダに置いてください。`;
      }
    }

    function renderAccordionToc() {
      const container = document.getElementById("accordion-toc");
      container.innerHTML = "";
      const groups = {};
      chapters.forEach((ch, idx) => {
        if (!groups[ch.vol]) groups[ch.vol] = [];
        groups[ch.vol].push({ ch, idx });
      });

      Object.keys(groups).forEach(volName => {
        const header = document.createElement("div");
        header.className = "accordion-header";
        header.innerHTML = `<span>▶ ${volName}</span><span style="font-size:0.75rem;">▼</span>`;
        
        const content = document.createElement("ul");
        content.className = "accordion-content";
        if (chapters[currentIndex].vol === volName) {
          content.classList.add("open");
          header.querySelector("span:first-child").innerText = `▼ ${volName}`;
        }

        header.onclick = () => {
          content.classList.toggle("open");
          header.querySelector("span:first-child").innerText = content.classList.contains("open") ? `▼ ${volName}` : `▶ ${volName}`;
        };

        groups[volName].forEach(item => {
          const li = document.createElement("li");
          li.className = "toc-item" + (item.idx === currentIndex ? " active" : "");
          li.innerText = item.ch.title;
          li.onclick = () => { loadChapter(item.idx); toggleSidebar(); };
          content.appendChild(li);
        });

        container.appendChild(header);
        container.appendChild(content);
      });
    }

    function renderTrackGrid() {
      const grid = document.getElementById("track-grid");
      grid.innerHTML = "";
      const currentVol = chapters[currentIndex].vol;

      chapters.forEach((ch, idx) => {
        if (ch.vol === currentVol) {
          const btn = document.createElement("div");
          btn.className = "link-item-btn" + (idx === currentIndex ? " current" : "");
          btn.onclick = () => { loadChapter(idx); switchView('lyric'); };
          btn.innerHTML = `<span>🎵 ${ch.song}</span><span style="font-size:0.75rem;color:#888;">${ch.title.split(' ')[0]}</span>`;
          grid.appendChild(btn);
        }
      });
    }

    // 目次用：章一覧ボタングリッド
    function renderChapterGrid() {
      const grid = document.getElementById("chapter-grid");
      grid.innerHTML = "";
      const currentVol = chapters[currentIndex].vol;

      chapters.forEach((ch, idx) => {
        if (ch.vol === currentVol && !ch.isTop) {
          const btn = document.createElement("div");
          btn.className = "link-item-btn";
          btn.onclick = () => { loadChapter(idx); switchView('book'); };
          btn.innerHTML = `<span>${ch.title}</span><span style="font-size:0.75rem;color:var(--accent-gold);">読む →</span>`;
          grid.appendChild(btn);
        }
      });
    }

    function renderOmakeSelector(ch) {
      const selector = document.getElementById("omake-selector");
      selector.innerHTML = "";
      if (!ch.isOmake || !ch.omakeTracks) {
        selector.style.display = "none";
        return;
      }
      selector.style.display = "flex";

      ch.omakeTracks.forEach((track, idx) => {
        const btn = document.createElement("button");
        btn.className = "omake-btn" + (idx === 0 ? " active" : "");
        btn.innerText = track.name;
        btn.onclick = async () => {
          document.querySelectorAll(".omake-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("song-name").innerText = track.name;
          const lyrics = await fetchText("lyrics/" + track.file);
          document.getElementById("lyrics-text").innerHTML = parseLyricText(lyrics);
        };
        selector.appendChild(btn);
      });
    }

    function updateFooterNavLabels() {
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      if (currentView === 'book') {
        prevBtn.innerText = "← 前の章";
        nextBtn.innerText = "次の章 →";
      } else {
        prevBtn.innerText = "← 前の曲";
        nextBtn.innerText = "次の曲 →";
      }
    }

    async function loadChapter(index) {
      currentIndex = index;
      const ch = chapters[index];

      // 【確定仕様】上部は全ページ共通で「赤字の巻タイトル」のみ！
      document.getElementById("vol-tag").innerText = ch.vol;
      document.getElementById("song-name").innerText = ch.song;
      
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      if (ch.mp3 && ch.mp3.trim() !== "") {
        player.src = ch.mp3;
        player.style.display = "block";
        status.innerText = "";
      } else {
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        status.innerText = "（🎵 音源準備中）";
      }

      // 小説本文読み込み
      document.getElementById("novel-text").innerHTML = "<p>読み込み中...</p>";
      const rawNovel = await fetchText("novel/" + ch.novelFile);
      document.getElementById("novel-text").innerHTML = parseNovelText(rawNovel, ch);

      // 歌詞読み込み
      if (ch.isOmake) {
        renderOmakeSelector(ch);
        const firstOmake = await fetchText("lyrics/" + ch.omakeTracks[0].file);
        document.getElementById("lyrics-text").innerHTML = parseLyricText(firstOmake);
      } else {
        document.getElementById("omake-selector").style.display = "none";
        document.getElementById("lyrics-text").innerText = "読み込み中...";
        const rawLyric = await fetchText("lyrics/" + ch.lyricFile);
        document.getElementById("lyrics-text").innerHTML = parseLyricText(rawLyric);
      }

      // 目次ページのときは章一覧ボタンを表示、各章では目次に戻るボタンを表示
      if (ch.isTop) {
        document.getElementById("top-chapter-portal").style.display = "block";
        document.getElementById("book-footer").style.display = "none";
        renderChapterGrid();
      } else {
        document.getElementById("top-chapter-portal").style.display = "none";
        document.getElementById("book-footer").style.display = "block";
      }

      renderTrackGrid();
      switchView(currentView);

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === chapters.length - 1);
      renderAccordionToc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function returnToVolumeToc() {
      loadChapter(chapters[currentIndex].topIndex || 0);
    }

    function switchView(type) {
      currentView = type;
      document.getElementById("tab-book").classList.toggle("active", type === 'book');
      document.getElementById("tab-lyric").classList.toggle("active", type === 'lyric');
      document.getElementById("content-book").classList.toggle("active", type === 'book');
      document.getElementById("content-lyric").classList.toggle("active", type === 'lyric');
      updateFooterNavLabels();
    }

    function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
    function nextChapter() { if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1); }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function toggleFontSize() {
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      document.getElementById("novel-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("font-size-label").innerText = fontSizeLabels[currentFontSizeIdx];
    }

    function init() {
      renderAccordionToc();
      loadChapter(0);
    }
    init();
  </script>
