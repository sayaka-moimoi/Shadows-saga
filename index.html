<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows Saga - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 0.8rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
    }
    .chapter-title {
      font-size: 1.4rem;
      color: #fff;
      margin: 8px 0 10px;
      letter-spacing: 1px;
    }
    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }
    .novel-body { font-size: 1.05rem; letter-spacing: 0.05em; }
    .novel-body p { margin-bottom: 1.6em; text-indent: 1em; }
    .novel-body p.no-indent { text-indent: 0; }
    .novel-body .preview-box {
      margin-top: 35px;
      padding: 18px;
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      font-size: 0.9rem;
      color: #bbb;
      text-indent: 0;
    }
    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
      font-size: 1rem;
      line-height: 2.2;
      white-space: pre-wrap;
      color: #ccc;
      text-align: center;
    }
    .bottom-section {
      margin-top: 45px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .btn-return-toc {
      background: var(--panel-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: sans-serif;
      font-weight: bold;
    }
    .tracklist-card {
      margin-top: 40px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .tracklist-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-red);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .track-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .track-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--accent-gold);
      font-family: sans-serif;
    }
    .toc-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px 0; font-family: sans-serif; }
    .toc-item {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .toc-item.active { background: var(--panel-bg); color: var(--accent-gold); border-left: 3px solid var(--accent-gold); }
    .toc-vol-title { font-size: 0.75rem; color: var(--accent-red); font-weight: bold; padding: 15px 20px 5px; }
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; z-index: 150; }
    .overlay.open { display: block; }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 17, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      z-index: 90;
    }
    .nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" onclick="loadChapter(0)">SHADOWS SAGA</div>
    <div class="header-controls">
      <button class="btn-icon" onclick="toggleFontSize()">文字: <span id="font-size-label">中</span></button>
      <button class="btn-icon" onclick="toggleSidebar()">目次 ☰</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>目次一覧</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>

  <main>
    <div class="chapter-header">
      <div class="volume-tag" id="vol-tag">SHADOWS SAGA</div>
      <h1 class="chapter-title" id="chapter-title">目次</h1>
    </div>

    <div class="audio-card">
      <div class="audio-info">
        <div class="audio-title-wrap">
          <span class="audio-badge">BGM</span>
          <span class="audio-song-name" id="song-name">曲名</span>
        </div>
        <span class="no-audio-msg" id="audio-status"></span>
      </div>
      <audio id="audio-player" controls preload="metadata" src=""></audio>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tab-book" onclick="switchView('book')">📖 小説 (Book)</button>
      <button class="tab-btn" id="tab-lyric" onclick="switchView('lyric')">📜 歌詞 (Lyric)</button>
    </div>

    <div class="view-content active" id="content-book">
      <article class="novel-body" id="novel-text"></article>
      <div class="bottom-section" id="book-footer">
        <button class="btn-return-toc" onclick="loadChapter(0)">📑 もくじ（トップ）に戻る</button>
      </div>
    </div>

    <div class="view-content" id="content-lyric">
      <div class="lyrics-body" id="lyrics-text"></div>
      <div class="tracklist-card">
        <div class="tracklist-header">💿 収録曲リスト（タップで移動）</div>
        <div class="track-grid" id="track-grid"></div>
      </div>
    </div>
  </main>

  <div class="footer-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevChapter()">← 前の章</button>
    <button class="nav-btn" id="next-btn" onclick="nextChapter()">次の章 →</button>
  </div>

  <!-- ここで外部の data.js を読み込む！ -->
  <script src="data.js"></script>
  <script>
    let currentIndex = 0;
    const fontSizes = ["0.95rem", "1.05rem", "1.2rem"];
    const fontSizeLabels = ["小", "中", "大"];
    let currentFontSizeIdx = 1;

    function init() {
      if (typeof chapters === "undefined" || !chapters.length) {
        document.getElementById("novel-text").innerHTML = "<p style='color:red;'>⚠️ data.js が見つかりません。index.html と同じ場所に data.js を置いてください。</p>";
        return;
      }
      renderToc();
      loadChapter(0);
    }

    function renderToc() {
      const tocList = document.getElementById("toc-list");
      tocList.innerHTML = "";
      let currentVol = "";
      chapters.forEach((ch, idx) => {
        if (ch.vol !== currentVol) {
          currentVol = ch.vol;
          const volTitle = document.createElement("li");
          volTitle.className = "toc-vol-title";
          volTitle.innerText = currentVol;
          tocList.appendChild(volTitle);
        }
        const li = document.createElement("li");
        li.className = "toc-item" + (idx === currentIndex ? " active" : "");
        li.innerText = ch.title;
        li.onclick = () => { loadChapter(idx); toggleSidebar(); };
        tocList.appendChild(li);
      });
    }

    function renderTrackGrid() {
      const grid = document.getElementById("track-grid");
      grid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        const btn = document.createElement("div");
        btn.className = "track-btn" + (idx === currentIndex ? " current" : "");
        btn.onclick = () => { loadChapter(idx); switchView('lyric'); };
        btn.innerHTML = `<span>🎵 ${ch.song}</span><span style="font-size:0.75rem;color:#888;">${ch.title.split(' ')[0]}</span>`;
        grid.appendChild(btn);
      });
    }

    function loadChapter(index) {
      currentIndex = index;
      const ch = chapters[index];
      document.getElementById("vol-tag").innerText = ch.vol;
      document.getElementById("chapter-title").innerText = ch.title;
      document.getElementById("song-name").innerText = ch.song;
      
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      if (ch.mp3 && ch.mp3.trim() !== "") {
        player.src = ch.mp3;
        player.style.display = "block";
        status.innerText = "";
      } else {
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        status.innerText = "（🎵 音源準備中）";
      }

      document.getElementById("novel-text").innerHTML = ch.content;
      document.getElementById("lyrics-text").innerText = ch.lyrics;
      document.getElementById("book-footer").style.display = (currentIndex === 0) ? "none" : "block";

      renderTrackGrid();
      switchView('book');

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === chapters.length - 1);
      renderToc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchView(type) {
      document.getElementById("tab-book").classList.toggle("active", type === 'book');
      document.getElementById("tab-lyric").classList.toggle("active", type === 'lyric');
      document.getElementById("content-book").classList.toggle("active", type === 'book');
      document.getElementById("content-lyric").classList.toggle("active", type === 'lyric');
    }

    function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
    function nextChapter() { if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1); }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function toggleFontSize() {
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      document.getElementById("novel-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("font-size-label").innerText = fontSizeLabels[currentFontSizeIdx];
    }

    // 画面読み込み時に確実に実行
    init();
  </script>
</body>
</html>
