<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows:SAGA - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2.1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-icon:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 1.35rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0;
    }

    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }

    .novel-body, .lyrics-body {
      font-size: 1.0rem;
      letter-spacing: 0.05em;
    }

    /* 【改修】余計なCSSマージンは完全ゼロ！余白はテキスト内の空行に100%連動 */
    .block-base {
      white-space: pre-wrap;
      line-height: 2.1;
      margin: 0;
      padding: 0;
    }
    strong {
      color: #fff;
      font-weight: bold;
    }
    .style-gold {
      color: var(--accent-gold);
      font-weight: bold;
      font-size: 1.45em;
    }
    .style-white {
      color: var(--text-color);
      font-size: 1.0em;
    }
    .style-redbox {
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      padding: 12px 18px;
      font-size: 0.92em;
      color: #ccc;
      margin: 0;
    }
    .align-left { text-align: left; }
    .align-center { text-align: center; }
    .align-right { text-align: right; }

    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
    }

    .omake-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .omake-btn {
      background: #1e1e28;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .omake-btn.active {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    .link-list-card {
      margin-top: 40px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .link-list-header {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 14px;
      letter-spacing: 1px;
      line-height: 1.5;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .link-item-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .link-item-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #1d1d28;
    }
    .link-item-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px
