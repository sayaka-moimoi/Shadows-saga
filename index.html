<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows:SAGA - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2.1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-icon:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 1.35rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0;
    }

    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }

    /* ===== 【新機能】インチキレトロイコライザー ===== */
    .retro-equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      margin-left: 6px;
    }
    .eq-bar {
      width: 3px;
      background: #00ff66;
      border-radius: 1px;
      height: 3px;
      transition: height 0.1s;
    }
    .retro-equalizer.playing .bar-1 { animation: eqAnim1 0.4s infinite alternate ease-in-out; }
    .retro-equalizer.playing .bar-2 { animation: eqAnim2 0.3s infinite alternate ease-in-out; }
    .retro-equalizer.playing .bar-3 { animation: eqAnim3 0.5s infinite alternate ease-in-out; }
    .retro-equalizer.playing .bar-4 { animation: eqAnim4 0.35s infinite alternate ease-in-out; }
    @keyframes eqAnim1 { from { height: 3px; } to { height: 14px; } }
    @keyframes eqAnim2 { from { height: 5px; } to { height: 12px; } }
    @keyframes eqAnim3 { from { height: 2px; } to { height: 15px; } }
    @keyframes eqAnim4 { from { height: 4px; } to { height: 10px; } }

    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }

    .novel-body, .lyrics-body {
      font-size: 1.0rem;
      letter-spacing: 0.05em;
    }

    .block-base {
      white-space: pre-wrap;
      line-height: 2.1;
      margin: 0;
      padding: 0;
    }
    strong { color: #fff; font-weight: bold; }
    .style-gold { color: var(--accent-gold); font-weight: bold; font-size: 1.45em; }
    .style-white { color: var(--text-color); font-size: 1.0em; }
    .style-redbox {
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      padding: 10px 18px;
      font-size: 0.92em;
      color: #ccc;
      margin: 0;
    }
    .align-left { text-align: left; }
    .align-center { text-align: center; }
    .align-right { text-align: right; }

    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
    }

    /* レトロアクセスカウンター */
    .retro-counter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 25px 0 35px;
      font-family: "Courier New", Courier, monospace;
    }
    .counter-label {
      font-size: 0.75rem;
      color: var(--accent-gold);
      letter-spacing: 3px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .counter-display {
      display: inline-flex;
      background: #000;
      padding: 4px 6px;
      border: 3px inset #555;
      border-radius: 3px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.9);
      cursor: pointer;
    }
    .counter-digit {
      display: inline-block;
      width: 20px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: #0a0a0a;
      color: #00ff66;
      font-size: 1.25rem;
      font-weight: bold;
      border: 1px inset #222;
      margin: 0 1px;
      text-shadow: 0 0 4px #00ff66;
    }

    /* ===== 【新機能】Web拍手エリア ===== */
    .clap-container {
      margin-top: 35px;
      padding: 20px 16px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
      font-family: sans-serif;
    }
    .btn-clap {
      background: #20202e;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn-clap:hover {
      background: var(--accent-gold);
      color: #000;
      transform: scale(1.03);
    }
    .clap-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .clap-note {
      font-size: 0.75rem;
      color: #777;
      margin-top: 8px;
    }
    .clap-response-card {
      margin-top: 15px;
      padding: 14px 18px;
      background: #1a1a26;
      border: 1px dashed var(--accent-gold);
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.8;
      color: #fff;
      display: none;
      animation: popIn 0.25s ease;
      text-align: left;
    }

    /* キリ番ポップアップモーダル */
    .kiriban-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .kiriban-card {
      background: #15151e;
      border: 3px double var(--accent-gold);
      border-radius: 8px;
      max-width: 440px;
      width: 100%;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-family: sans-serif;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .kiriban-row-1 {
      font-size: 1.3rem;
      color: var(--accent-gold);
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .kiriban-row-2 {
      background: #09090d;
      border: 1px dashed var(--border-color);
      color: #00ff66;
      font-family: "MS PGothic", "Courier New", monospace;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 4px;
      margin: 12px 0 16px;
      white-space: nowrap;
      overflow-x: auto;
    }
    .kiriban-row-3 {
      font-size: 1.0rem;
      color: #ddd;
      margin-bottom: 4px;
    }
    .kiriban-row-4 {
      font-size: 1.45rem;
      color: var(--accent-gold);
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .kiriban-row-5 {
      font-size: 1.1rem;
      color: #fff;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .kiriban-row-6 {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 20px;
    }
    .btn-kiriban-close {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 8px 30px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .omake-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .omake-btn {
      background: #1e1e28;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .omake-btn.active {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    .link-list-card {
      margin-top: 40px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .link-list-header {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 14px;
      letter-spacing: 1px;
      line-height: 1.5;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .link-item-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .link-item-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #1d1d28;
    }
    .link-item-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--accent-gold);
      font-family: sans-serif;
    }
    .toc-container { flex: 1; overflow-y: auto; padding: 10px 0; font-family: sans-serif; }
    .accordion-header {
      padding: 14px 20px;
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }
    .accordion-content { display: none; list-style: none; }
    .accordion-content.open { display: block; }
    .toc-item {
      padding: 10px 20px 10px 30px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .toc-item:hover, .toc-item.active {
      background: var(--panel-bg);
      color: var(--accent-gold);
      border-left: 3px solid var(--accent-gold);
    }
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; z-index: 150; }
    .overlay.open { display: block; }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 17, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      z-index: 90;
    }
    .nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" onclick="loadChapter(0)">Shadows:SAGA</div>
    <div class="header-controls">
      <button class="btn-icon" onclick="toggleFontSize()">文字: <span id="font-size-label">中</span></button>
      <button class="btn-icon" onclick="toggleSidebar()">目次 ☰</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>目次一覧</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="toc-container" id="accordion-toc"></div>
  </aside>

  <!-- 【さやかさん指定の完全行構成】キリ番ポップアップモーダル -->
  <div id="kiriban-modal" class="kiriban-overlay" style="display: none;">
    <div class="kiriban-card">
      <div class="kiriban-row-1">💐キリ番💐</div>
      <div class="kiriban-row-2" id="kiriban-aa-text">ｹﾞﾄｰ⊂(ﾟДﾟ⊂⌒｀つ≡≡≡≡ｽﾞｻｰ</div>
      <div class="kiriban-row-3">あなたは記念すべき</div>
      <div class="kiriban-row-4" id="kiriban-num">【44よんよん】人目</div>
      <div class="kiriban-row-5">のキツネ様DEATH！！🤘🦊</div>
      <div class="kiriban-row-6">BBSにメッセージをカキコしてネ.ᐟ(嘘)</div>
      <button class="btn-kiriban-close" onclick="closeKiribanModal()">閉じる</button>
    </div>
  </div>

  <main>
    <div class="chapter-header">
      <div class="volume-tag" id="vol-tag">第１巻：Dawn Beyond Shadows</div>
    </div>

    <div class="audio-card" id="audio-card">
      <div class="audio-info">
        <div class="audio-title-wrap">
          <span class="audio-badge">BGM</span>
          <span class="audio-song-name" id="song-name">曲名</span>
          <!-- 【新機能】インチキレトロイコライザー（再生中カチャカチャ動く！） -->
          <div class="retro-equalizer" id="retro-eq">
            <span class="eq-bar bar-1"></span>
            <span class="eq-bar bar-2"></span>
            <span class="eq-bar bar-3"></span>
            <span class="eq-bar bar-4"></span>
          </div>
        </div>
        <span class="no-audio-msg" id="audio-status"></span>
      </div>
      <audio id="audio-player" controls preload="metadata" src=""></audio>
    </div>

    <div class="view-tabs" id="view-tabs">
      <button class="tab-btn active" id="tab-book" onclick="switchView('book')">📖 小説 (Book)</button>
      <button class="tab-btn" id="tab-lyric" onclick="switchView('lyric')">📜 歌詞 (Lyric)</button>
    </div>

    <!-- 小説エリア -->
    <div class="view-content active" id="content-book">
      <article class="novel-body" id="novel-text"></article>

      <!-- 90年代レトロアクセスカウンター -->
      <div id="retro-counter-area" class="retro-counter-wrap" style="display: none;">
        <div class="counter-label">★ TOTAL VISITOR ★</div>
        <div class="counter-display" id="counter-digits" onclick="previewKiriban()" title="タップでキリ番プレビュー！">
          <span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">0</span><span class="counter-digit">4</span><span class="counter-digit">4</span>
        </div>
      </div>

      <!-- 【新機能】Web拍手エリア（小説側） -->
      <div class="clap-container">
        <button class="btn-clap" onclick="sendClap()">
          👏🏻✨ Web拍手を送る <span class="clap-badge" id="clap-count-display">0</span>
        </button>
        <div class="clap-note">※メッセージはAIが自動で出してます(笑)</div>
        <div class="clap-response-card" id="clap-popup-book"></div>
      </div>

      <div class="link-list-card" id="book-chapter-card">
        <div class="link-list-header" id="book-chapter-header" style="color: var(--accent-gold);">📖 章一覧（タップで移動）</div>
        <div class="link-grid" id="chapter-grid"></div>
      </div>
    </div>

    <!-- 歌詞エリア -->
    <div class="view-content" id="content-lyric">
      <div class="omake-selector" id="omake-selector" style="display: none;"></div>
      <div class="lyrics-body" id="lyrics-text"></div>

      <!-- 【新機能】Web拍手エリア（歌詞側） -->
      <div class="clap-container">
        <button class="btn-clap" onclick="sendClap()">
          👏🏻✨ この曲に拍手を送る <span class="clap-badge" id="clap-count-display-lyric">0</span>
        </button>
        <div class="clap-note">※メッセージはAIが自動で出してます(笑)</div>
        <div class="clap-response-card" id="clap-popup-lyric"></div>
      </div>

      <div class="link-list-card" id="tracklist-container">
        <div class="link-list-header" id="tracklist-header" style="color: var(--accent-red);">💿 収録曲リスト（タップで移動）</div>
        <div class="link-grid" id="track-grid"></div>
      </div>
    </div>
  </main>

  <div class="footer-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevChapter()">← 前の章</button>
    <button class="nav-btn" id="next-btn" onclick="nextChapter()">次の章 →</button>
  </div>

  <script>
    const chapters = [
      // ----------------- 第１巻 -----------------
      { vol: "第１巻：Dawn Beyond Shadows", title: "第１巻 もくじ", song: "1.Dawn Beyond Shadows", mp3: "BGM/1-01.Dawn Beyond Shadows.mp3", novelFile: "v1_00.txt", lyricFile: "v1_00.txt", isTop: true },
      { vol: "第１巻：Dawn Beyond Shadows", title: "1# 黎明", song: "2.Ember!", mp3: "BGM/1-02.Ember!.mp3", novelFile: "v1_01.txt", lyricFile: "v1_01.txt" },
      { vol: "第１巻：Dawn Beyond Shadows", title: "2# 交戦", song: "3.Light of Resistance", mp3: "BGM/1-03.Light of Resistance.mp3", novelFile: "v1_02.txt", lyricFile: "v1_02.txt" },
      { vol: "第１巻：Dawn Beyond Shadows", title: "3# 脅威", song: "4.Unstoppable Darkness", mp3: "BGM/1-04.Unstoppable Darkness.mp3", novelFile: "v1_03.txt", lyricFile: "v1_03.txt" },
      { vol: "第１巻：Dawn Beyond Shadows", title: "4# 紅白", song: "5.緋色の決戦", mp3: "BGM/1-05.緋色の決戦.mp3", novelFile: "v1_04.txt", lyricFile: "v1_04.txt" },

    // ===== さやかさん仕様書 100%完全準拠パーサー =====
    function parseCustomMarkup(rawText, defaultAlign = "align-left") {
      if (!rawText) return "<p>（内容がありません）</p>";

      rawText = rawText.replace(/\r\n/g, "\n");
      const lines = rawText.split("\n");

      let blocks = [];
      let currentStyle = "style-white";
      let currentAlign = defaultAlign;
      let currentLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith("---")) {
          if (currentLines.length > 0) {
            blocks.push({
              style: currentStyle,
              align: currentAlign,
              lines: currentLines
            });
            currentLines = [];
          }

          if (line.includes("赤枠")) {
            currentStyle = "style-redbox";
          } else if (line.includes("黄") || line.includes("タイトル")) {
            currentStyle = "style-gold";
          } else {
            currentStyle = "style-white";
          }

          if (line.includes("中") || line.includes("センタリング") || line.includes("中央")) {
            currentAlign = "align-center";
          } else if (line.includes("右")) {
            currentAlign = "align-right";
          } else if (line.includes("左")) {
            currentAlign = "align-left";
          }

          continue;
        }

        currentLines.push(line);
      }

      if (currentLines.length > 0) {
        blocks.push({
          style: currentStyle,
          align: currentAlign,
          lines: currentLines
        });
      }

      let html = "";
      blocks.forEach(block => {
        let content = block.lines
          .map(l => l.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>'))
          .join("\n");

        if (content.endsWith("\n")) {
          content += "\u200B";
        }

        html += `<div class="block-base ${block.style} ${block.align}">${content}</div>`;
      });

      return html;
    }

      "ｷﾀﾜｧ━━━(n‘∀‘)η━━━!!!!!!",
      "ｷﾀ━━━━( ˇωˇ )━━━━!!",
      "(ﾟ∀ﾟ)o彡゜ｷﾘﾊﾞﾝ！ｷﾘﾊﾞﾝ！",
      "ｷﾀ─wwﾍ√ﾚvv~(ﾟ∀ﾟ)─wwﾍ√ﾚvv~─!!!!",
      "\\m/(>_<)\\m/ ｷﾀｰ!!"
    ];

    // ===== Web拍手お礼ランダムメッセージ =====
    const clapMessages = [
      "モアメタル：「パチパチありがとー！ お礼に美味しいお菓子（回らないお寿司でも可）をあげるね！٩(ˊᗜˋ*)و🍣」",
      "スーメタル：「拍手ありがとう！ 音楽は心をつなぐ力だからね。……あれ？ 今の拍手、私どのパートで受けるんだっけ？」",
      "モモメタル：「拍手ありがとうございます！ 旅籠のお茶のおかわり、すぐお持ちしますね！🍵」",
      "サヤメタ：「……拍手など不要だ。……だが、悪く……ない。（そっぽを向いて口元が緩む）」",
      "かいとん。姐さん：「ありがとね。ほら、辛麺でも啜って一杯呑んでいきな（徳利）」",
      "フラゴドン師匠：「喝！！ ……じゃが、拍手をもらうのは悪くないのぅ。」",
      "ユミックス女将：「アンタいい人だねぇ！ 今日は腕によりをかけてご馳走作るから、ゆっくり泊まってきな！」",
      "【超激レア（1%）】カニ：「（チョキチョキ……カニ折のハサミが愛を切り開いた！）🦀✂️✨」"
    ];

    let currentVisitorCount = 44;
    let currentClapCount = 0;

    // カウンター＆キリ番起動
    async function initCounter() {
      try {
        const res = await fetch("https://api.counterapi.dev/v1/sayaka-moimoi-shadows-saga/visits/up");
        if (res.ok) {
          const data = await res.json();
          currentVisitorCount = data.count;
        } else {
          throw new Error();
        }
      } catch (e) {
        let localCount = parseInt(localStorage.getItem("shadows_saga_visits") || "43");
        localCount++;
        localStorage.setItem("shadows_saga_visits", localCount);
        currentVisitorCount = localCount;
      }

      const countStr = String(currentVisitorCount).padStart(6, "0");
      const digitsContainer = document.getElementById("counter-digits");
      if (digitsContainer) {
        digitsContainer.innerHTML = countStr.split("").map(d => `<span class="counter-digit">${d}</span>`).join("");
      }

      // キリ番判定（下2桁が44）
      const sessionKey = "kiriban_shown_" + currentVisitorCount;
      if (currentVisitorCount % 100 === 44 && !sessionStorage.getItem(sessionKey)) {
        sessionStorage.setItem(sessionKey, "true");
        showKiribanModal(currentVisitorCount);
      }

      // 拍手数の初期ロード
      initClapCount();
    }

    function showKiribanModal(count) {
      document.getElementById("kiriban-num").innerText = `【${count}よんよん】人目`;
      // ランダムAA選定
      const randomAA = kiribanAAList[Math.floor(Math.random() * kiribanAAList.length)];
      document.getElementById("kiriban-aa-text").innerText = randomAA;
      document.getElementById("kiriban-modal").style.display = "flex";
    }

    function closeKiribanModal() {
      document.getElementById("kiriban-modal").style.display = "none";
    }

    function previewKiriban() {
      showKiribanModal(currentVisitorCount);
    }

    // ===== Web拍手機能 =====
    async function initClapCount() {
      try {
        const res = await fetch("https://api.counterapi.dev/v1/sayaka-moimoi-shadows-saga/claps");
        if (res.ok) {
          const data = await res.json();
          currentClapCount = data.count;
        } else {
          throw new Error();
        }
      } catch (e) {
        currentClapCount = parseInt(localStorage.getItem("shadows_saga_claps") || "0");
      }
      updateClapDisplay();
    }

    function updateClapDisplay() {
      document.getElementById("clap-count-display").innerText = currentClapCount;
      document.getElementById("clap-count-display-lyric").innerText = currentClapCount;
    }

    async function sendClap() {
      currentClapCount++;
      updateClapDisplay();
      localStorage.setItem("shadows_saga_claps", currentClapCount);

      // 非同期でAPIに送信（失敗しても画面は止まらない）
      fetch("https://api.counterapi.dev/v1/sayaka-moimoi-shadows-saga/claps/up").catch(() => {});

      // ランダムお礼メッセージ選定
      let chosenMsg;
      if (Math.random() < 0.02) {
        chosenMsg = clapMessages[clapMessages.length - 1]; // 激レアカニ
      } else {
        const normalList = clapMessages.slice(0, -1);
        chosenMsg = normalList[Math.floor(Math.random() * normalList.length)];
      }

      const activePopupId = (currentView === 'book') ? "clap-popup-book" : "clap-popup-lyric";
      const popup = document.getElementById(activePopupId);
      popup.innerHTML = `<div>${chosenMsg}</div>`;
      popup.style.display = "block";
    }

    async function fetchText(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Not Found");
        return await res.text();
      } catch (err) {
        return `⚠️ テキストファイル（${path}）がまだアップロードされていません。GitHubの該当フォルダに置いてください。`;
      }
    }

    function renderAccordionToc() {
      const container = document.getElementById("accordion-toc");
      container.innerHTML = "";
      const groups = {};
      chapters.forEach((ch, idx) => {
        if (!groups[ch.vol]) groups[ch.vol] = [];
        groups[ch.vol].push({ ch, idx });
      });

      Object.keys(groups).forEach(volName => {
        const header = document.createElement("div");
        header.className = "accordion-header";
        header.innerHTML = `<span>▶ ${volName}</span><span style="font-size:0.75rem;">▼</span>`;
        
        const content = document.createElement("ul");
        content.className = "accordion-content";
        if (chapters[currentIndex].vol === volName) {
          content.classList.add("open");
          header.querySelector("span:first-child").innerText = `▼ ${volName}`;
        }

        header.onclick = () => {
          content.classList.toggle("open");
          header.querySelector("span:first-child").innerText = content.classList.contains("open") ? `▼ ${volName}` : `▶ ${volName}`;
        };

        groups[volName].forEach(item => {
          const li = document.createElement("li");
          li.className = "toc-item" + (item.idx === currentIndex ? " active" : "");
          li.innerText = item.ch.title;
          li.onclick = () => { loadChapter(item.idx); toggleSidebar(); };
          content.appendChild(li);
        });

        container.appendChild(header);
        container.appendChild(content);
      });
    }

    function renderTrackGrid() {
      const grid = document.getElementById("track-grid");
      const header = document.getElementById("tracklist-header");
      grid.innerHTML = "";
      const currentGroup = getAlbumGroup(chapters[currentIndex].vol);

      if (currentGroup === "vol1") {
        header.innerHTML = "💿 ファーストアルバム<br>Dawn Beyond Shadows";
      } else if (currentGroup === "vol2") {
        header.innerHTML = "💿 セカンドアルバム<br>Shadows of Rebellion";
      } else {
        header.innerHTML = "💿 収録曲リスト";
      }

      chapters.forEach((ch, idx) => {
        if (getAlbumGroup(ch.vol) === currentGroup) {
          if (ch.isOmake && ch.omakeTracks) {
            ch.omakeTracks.forEach((track, tIdx) => {
              const isCurrent = (idx === currentIndex && currentOmakeIndex === tIdx);
              const btn = document.createElement("div");
              btn.className = "link-item-btn" + (isCurrent ? " current" : "");
              btn.onclick = () => {
                loadChapter(idx, tIdx);
                switchView('lyric');
              };
              btn.innerHTML = `<span>🎵 ${track.name}</span><span style="font-size:0.75rem;color:#888;">おまけ</span>`;
              grid.appendChild(btn);
            });
          } else if (ch.song && ch.song.trim() !== "") {
            const btn = document.createElement("div");
            btn.className = "link-item-btn" + (idx === currentIndex ? " current" : "");
            btn.onclick = () => { loadChapter(idx); switchView('lyric'); };
            btn.innerHTML = `<span>🎵 ${ch.song}</span><span style="font-size:0.75rem;color:#888;">${ch.title.split(' ')[0]}</span>`;
            grid.appendChild(btn);
          }
        }
      });
    }

    function renderChapterGrid() {
      const grid = document.getElementById("chapter-grid");
      const header = document.getElementById("book-chapter-header");
      grid.innerHTML = "";
      const currentGroup = getAlbumGroup(chapters[currentIndex].vol);

      if (currentGroup === "vol1") {
        header.innerText = "📖 第１巻 章一覧（タップで移動）";
      } else if (currentGroup === "vol2") {
        header.innerText = "📖 第２巻 章一覧（タップで移動）";
      } else if (currentGroup === "review") {
        header.innerText = "📖 考察アーカイブ一覧（タップで移動）";
      } else {
        header.innerText = "📖 一覧（タップで移動）";
      }

      chapters.forEach((ch, idx) => {
        if (getAlbumGroup(ch.vol) === currentGroup) {
          const btn = document.createElement("div");
          btn.className = "link-item-btn" + (idx === currentIndex ? " current" : "");
          btn.onclick = () => { loadChapter(idx); switchView('book'); };
          btn.innerHTML = `<span>${ch.title}</span><span style="font-size:0.75rem;color:var(--accent-gold);">読む →</span>`;
          grid.appendChild(btn);
        }
      });
    }

    async function selectOmakeTrack(tIdx) {
      currentOmakeIndex = tIdx;
      const ch = chapters[currentIndex];
      if (!ch.isOmake || !ch.omakeTracks) return;

      const track = ch.omakeTracks[tIdx];

      document.querySelectorAll(".omake-btn").forEach((b, i) => {
        b.classList.toggle("active", i === tIdx);
      });

      document.getElementById("song-name").innerText = track.name;

      const audioCard = document.getElementById("audio-card");
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      if (track.mp3 && track.mp3.trim() !== "") {
        audioCard.style.display = "block";
        player.src = track.mp3;
        player.style.display = "block";
        status.innerText = "";
        player.load();
      } else {
        player.pause();
        player.removeAttribute("src");
        player.load();
        audioCard.style.display = "none";
      }

      const lyrics = await fetchText("lyrics/" + track.file);
      document.getElementById("lyrics-text").innerHTML = parseCustomMarkup(lyrics, "align-center");

      renderTrackGrid();
    }

    function renderOmakeSelector(ch) {
      const selector = document.getElementById("omake-selector");
      selector.innerHTML = "";
      if (!ch.isOmake || !ch.omakeTracks) {
        selector.style.display = "none";
        return;
      }
      selector.style.display = "flex";

      ch.omakeTracks.forEach((track, idx) => {
        const btn = document.createElement("button");
        btn.className = "omake-btn" + (idx === currentOmakeIndex ? " active" : "");
        btn.innerText = track.name;
        btn.onclick = () => selectOmakeTrack(idx);
        selector.appendChild(btn);
      });
    }

    function updateFooterNavLabels() {
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      if (currentView === 'book') {
        prevBtn.innerText = "← 前の章";
        nextBtn.innerText = "次の章 →";
      } else {
        prevBtn.innerText = "← 前の曲";
        nextBtn.innerText = "次の曲 →";
      }
    }

    async function loadChapter(index, targetOmakeIdx = 0) {
      currentIndex = index;
      const ch = chapters[index];

      document.getElementById("vol-tag").innerText = ch.vol;
      document.getElementById("song-name").innerText = ch.song || "";
      
      const audioCard = document.getElementById("audio-card");
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      const eq = document.getElementById("retro-eq");
      
      // イコライザー停止
      if (eq) eq.classList.remove("playing");

      if (!ch.isOmake) {
        if (ch.mp3 && ch.mp3.trim() !== "") {
          audioCard.style.display = "block";
          player.src = ch.mp3;
          player.style.display = "block";
          status.innerText = "";
        } else {
          player.pause();
          player.removeAttribute("src");
          player.load();
          audioCard.style.display = "none";
        }
      }

      // 小説本文読み込み
      document.getElementById("novel-text").innerHTML = "<p>読み込み中...</p>";
      const rawNovel = await fetchText("novel/" + ch.novelFile);
      document.getElementById("novel-text").innerHTML = parseCustomMarkup(rawNovel, "align-left");

      // 拍手メッセージ枠を初期化（非表示）
      document.getElementById("clap-popup-book").style.display = "none";
      document.getElementById("clap-popup-lyric").style.display = "none";

      // 歌詞読み込み
      const viewTabs = document.getElementById("view-tabs");
      const hasLyric = Boolean(ch.isOmake || (ch.lyricFile && ch.lyricFile.trim() !== ""));

      if (hasLyric) {
        viewTabs.style.display = "flex";
        if (ch.isOmake) {
          renderOmakeSelector(ch);
          selectOmakeTrack(targetOmakeIdx);
        } else {
          document.getElementById("omake-selector").style.display = "none";
          document.getElementById("lyrics-text").innerText = "読み込み中...";
          const rawLyric = await fetchText("lyrics/" + ch.lyricFile);
          document.getElementById("lyrics-text").innerHTML = parseCustomMarkup(rawLyric, "align-center");
        }
        renderTrackGrid();
        switchView(currentView);
      } else {
        viewTabs.style.display = "none";
        document.getElementById("omake-selector").style.display = "none";
        document.getElementById("lyrics-text").innerHTML = "";
        switchView('book');
      }

      // 目次ページのときだけレトロカウンターを表示
      const counterArea = document.getElementById("retro-counter-area");
      if (ch.isTop) {
        counterArea.style.display = "flex";
      } else {
        counterArea.style.display = "none";
      }

      renderChapterGrid();

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === chapters.length - 1);
      renderAccordionToc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchView(type) {
      currentView = type;
      document.getElementById("tab-book").classList.toggle("active", type === 'book');
      document.getElementById("tab-lyric").classList.toggle("active", type === 'lyric');
      document.getElementById("content-book").classList.toggle("active", type === 'book');
      document.getElementById("content-lyric").classList.toggle("active", type === 'lyric');
      updateFooterNavLabels();
    }

    function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
    function nextChapter() { if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1); }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function toggleFontSize() {
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      document.getElementById("novel-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("lyrics-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("font-size-label").innerText = fontSizeLabels[currentFontSizeIdx];
    }

    // 音楽再生中のイコライザー連動
    function setupEqualizer() {
      const player = document.getElementById("audio-player");
      const eq = document.getElementById("retro-eq");
      if (player && eq) {
        player.addEventListener("play", () => eq.classList.add("playing"));
        player.addEventListener("pause", () => eq.classList.remove("playing"));
        player.addEventListener("ended", () => eq.classList.remove("playing"));
      }
    }

    function init() {
      renderAccordionToc();
      loadChapter(0);
      initCounter();
      setupEqualizer();
    }
    init();
  </script>
</body>
