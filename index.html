<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows Saga - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 0.8rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
    }
    .chapter-title {
      font-size: 1.4rem;
      color: #fff;
      margin: 8px 0 10px;
      letter-spacing: 1px;
    }
    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }
    .novel-body { font-size: 1.05rem; letter-spacing: 0.05em; }
    .novel-body p { margin-bottom: 1.6em; text-indent: 1em; }
    .novel-body p.no-indent { text-indent: 0; }
    .novel-body .preview-box {
      margin-top: 35px;
      padding: 18px;
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      font-size: 0.9rem;
      color: #bbb;
      text-indent: 0;
    }
    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
      font-size: 1rem;
      line-height: 2.2;
      white-space: pre-wrap;
      color: #ccc;
      text-align: center;
    }
    .bottom-section {
      margin-top: 45px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .btn-return-toc {
      background: var(--panel-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: sans-serif;
      font-weight: bold;
    }
    .link-list-card {
      margin-top: 25px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .link-list-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .link-item-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .link-item-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #1d1d28;
    }
    .link-item-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--accent-gold);
      font-family: sans-serif;
    }
    .toc-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px 0; font-family: sans-serif; }
    .toc-item {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .toc-item.active { background: var(--panel-bg); color: var(--accent-gold); border-left: 3px solid var(--accent-gold); }
    .toc-vol-title { font-size: 0.75rem; color: var(--accent-red); font-weight: bold; padding: 15px 20px 5px; }
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; z-index: 150; }
    .overlay.open { display: block; }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 17, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      z-index: 90;
    }
    .nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" onclick="loadChapter(0)">SHADOWS SAGA</div>
    <div class="header-controls">
      <button class="btn-icon" onclick="toggleFontSize()">文字: <span id="font-size-label">中</span></button>
      <button class="btn-icon" onclick="toggleSidebar()">目次 ☰</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>目次一覧</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>

  <main>
    <div class="chapter-header">
      <div class="volume-tag" id="vol-tag">SHADOWS SAGA</div>
      <h1 class="chapter-title" id="chapter-title">目次</h1>
    </div>

    <div class="audio-card">
      <div class="audio-info">
        <div class="audio-title-wrap">
          <span class="audio-badge">BGM</span>
          <span class="audio-song-name" id="song-name">曲名</span>
        </div>
        <span class="no-audio-msg" id="audio-status"></span>
      </div>
      <audio id="audio-player" controls preload="metadata" src=""></audio>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tab-book" onclick="switchView('book')">📖 小説 (Book)</button>
      <button class="tab-btn" id="tab-lyric" onclick="switchView('lyric')">📜 歌詞 (Lyric)</button>
    </div>

    <div class="view-content active" id="content-book">
      <article class="novel-body" id="novel-text"></article>
      <div class="link-list-card" id="top-chapter-portal" style="display: none;">
        <div class="link-list-header">📖 章一覧（タップで直接読む）</div>
        <div class="link-grid" id="chapter-grid"></div>
      </div>
      <div class="bottom-section" id="book-footer">
        <button class="btn-return-toc" onclick="loadChapter(0)">📑 もくじ（トップ）に戻る</button>
      </div>
    </div>

    <div class="view-content" id="content-lyric">
      <div class="lyrics-body" id="lyrics-text"></div>
      <div class="link-list-card">
        <div class="link-list-header" style="color: var(--accent-red);">💿 収録曲リスト（タップで移動）</div>
        <div class="link-grid" id="track-grid"></div>
      </div>
    </div>
  </main>

  <div class="footer-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevChapter()">← 前の章</button>
    <button class="nav-btn" id="next-btn" onclick="nextChapter()">次の章 →</button>
  </div>

  <script>
    // ===== 第1巻 完全ノーカットデータ（全32章＋Bonus） =====

        content: `

        mp3: "",
        lyrics: `"Once, melodies ruled the sky...\nNow, shadows choke the final note...\nBut in the ruins─a spark screams!!"\n\n錆びたオルゴール 針は止まった\n闇に奪われた 調べの翼\nDon't fade... 震える旋律\n灰の中の Emberの灯火\n\n燃え上がれ!、Ember!\nBreak the chains! 紅蓮のStage\n沈黙を切り裂く 歌のヤイバ`,
        content: `
          <p>かつて、世界は「光」と呼ばれるエネルギーで満ち、人々は音楽と共に平和に暮らしていた。だが、その均衡は突如として崩れた。</p>
          <p>——影の勢力——<br>それは、光を憎み、世界を闇で覆い尽くそうとする者たち。彼らが現れて以来、かつて輝いていた街は廃墟と化し、空は重く垂れ込め、音楽は静寂に呑み込まれた。光を持つ者は次々と追われ、希望は消え去ろうとしていた。</p>

          <p>だが、影の勢力を束ねるメタル四天王──ルマンドX、響メタル、紅白メタル、そして冷徹なサヤメタ率いるメタル四天王が立ちはだかる。闇の勢力は、着実に世界を飲み込みつつあった。</p>
          <div class="preview-box">次回、DawnBeyondShadows、第2話『交戦』。荒廃した都市で繰り広げられる激しい戦闘。彼女たちの運命は如何に。君は、刻の涙を見る。</div>
        `

      {

        title: "2# 交戦",
        song: "Light of Resistance",
        mp3: "",
        lyrics: `Stand and fight, warriors of light!\nBurning bright, we’ll end the night!\nRise again, let the shadows fall,\nThe time has come, we’ll break the wall!\n\nRaise your voice for the light of resistance!\n闇を越え、新たな時代へ\nRaise your blade for the light of resistance!\n絆を胸に、勝利を掴め！`,
        content: `
          <p>廃墟と化した都市の中心部。かつて栄華を誇った高層ビル群は無惨に崩れ、無数の瓦礫が荒野と化していた。</p>

          <p>黒い波動をまとった兵士たちとの激闘が始まる。スーメタルの光の波動、モアとユイの流麗な体術、そしてマークメタルの蛍丸の一閃が影の軍勢を薙ぎ払う！ だが、影の本拠地にはまだ強大な四天王が待ち構えていた。</p>
          <div class="preview-box">さ～て、次回のDawnBeyondShadowsは？ モアメタルDEATH🤘。影の四天王がついに動き出しました。でも負けませんよ！ 第3話『脅威』次回もまた、見てくださいね～。プッチャキツネアーップ！🤘🤘アーーーーッ！</div>

          <p>「——隙、あり。」サヤメタの影折が防御を突き破る。「守れなかった」という罪悪感が心を塗りつぶし、彼の瞳から光が消え去った。影の四天王・マークメタルの誕生だった。</p>

        mp3: "",

    let currentIndex = 0;
    const fontSizes = ["0.95rem", "1.05rem", "1.2rem"];
    const fontSizeLabels = ["小", "中", "大"];
    let currentFontSizeIdx = 1;

    function init() {
      renderToc();
      loadChapter(0);
    }

    function renderToc() {
      const tocList = document.getElementById("toc-list");
      tocList.innerHTML = "";
      let currentVol = "";
      chapters.forEach((ch, idx) => {
        if (ch.vol !== currentVol) {
          currentVol = ch.vol;
          const volTitle = document.createElement("li");
          volTitle.className = "toc-vol-title";
          volTitle.innerText = currentVol;
          tocList.appendChild(volTitle);
        }
        const li = document.createElement("li");
        li.className = "toc-item" + (idx === currentIndex ? " active" : "");
        li.innerText = ch.title;
        li.onclick = () => { loadChapter(idx); toggleSidebar(); };
        tocList.appendChild(li);
      });
    }

    function renderTrackGrid() {
      const grid = document.getElementById("track-grid");
      grid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        const btn = document.createElement("div");
        btn.className = "link-item-btn" + (idx === currentIndex ? " current" : "");
        btn.onclick = () => { loadChapter(idx); switchView('lyric'); };
        btn.innerHTML = `<span>🎵 ${ch.song}</span><span style="font-size:0.75rem;color:#888;">${ch.title.split(' ')[0]}</span>`;
        grid.appendChild(btn);
      });
    }

    function renderChapterGrid() {
      const grid = document.getElementById("chapter-grid");
      grid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        if (idx === 0) return;
        const btn = document.createElement("div");
        btn.className = "link-item-btn";
        btn.onclick = () => { loadChapter(idx); switchView('book'); };
        btn.innerHTML = `<span>${ch.title}</span><span style="font-size:0.75rem;color:var(--accent-gold);">読む →</span>`;
        grid.appendChild(btn);
      });
    }

    function loadChapter(index) {
      currentIndex = index;
      const ch = chapters[index];
      document.getElementById("vol-tag").innerText = ch.vol;
      document.getElementById("chapter-title").innerText = ch.title;
      document.getElementById("song-name").innerText = ch.song;
      
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      if (ch.mp3 && ch.mp3.trim() !== "") {
        player.src = ch.mp3;
        player.style.display = "block";
        status.innerText = "";
      } else {
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        status.innerText = "（🎵 音源準備中）";
      }

      document.getElementById("novel-text").innerHTML = ch.content;
      document.getElementById("lyrics-text").innerText = ch.lyrics;

      if (currentIndex === 0) {
        document.getElementById("top-chapter-portal").style.display = "block";
        document.getElementById("book-footer").style.display = "none";
        renderChapterGrid();
      } else {
        document.getElementById("top-chapter-portal").style.display = "none";
        document.getElementById("book-footer").style.display = "block";
      }

      renderTrackGrid();
      switchView('book');

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === chapters.length - 1);
      renderToc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchView(type) {
      document.getElementById("tab-book").classList.toggle("active", type === 'book');
      document.getElementById("tab-lyric").classList.toggle("active", type === 'lyric');
      document.getElementById("content-book").classList.toggle("active", type === 'book');
      document.getElementById("content-lyric").classList.toggle("active", type === 'lyric');
    }

    function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
    function nextChapter() { if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1); }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function toggleFontSize() {
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      document.getElementById("novel-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("font-size-label").innerText = fontSizeLabels[currentFontSizeIdx];
    }

    init();
  </script>
