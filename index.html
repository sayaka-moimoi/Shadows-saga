<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows Saga - Official Web Reader</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --text-color: #dcdcdc;
      --accent-red: #c92a2a;
      --accent-gold: #d4af37;
      --panel-bg: #16161e;
      --border-color: #2a2a38;
      --font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", "Noto Serif JP", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(13, 13, 17, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-family: sans-serif;
      cursor: pointer;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .chapter-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .volume-tag {
      font-size: 0.8rem;
      color: var(--accent-red);
      font-weight: bold;
      letter-spacing: 2px;
    }
    .chapter-title {
      font-size: 1.4rem;
      color: #fff;
      margin: 8px 0 10px;
      letter-spacing: 1px;
    }
    .audio-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
    }
    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-title-wrap { display: flex; align-items: center; gap: 8px; }
    .audio-badge {
      background: var(--accent-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }
    .audio-song-name { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
    audio { width: 100%; height: 38px; filter: invert(0.9) hue-rotate(180deg); }
    .no-audio-msg { font-size: 0.8rem; color: #777; font-style: italic; }
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      font-family: sans-serif;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #888;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #222230;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .view-content { display: none; }
    .view-content.active { display: block; }
    .novel-body { font-size: 1.05rem; letter-spacing: 0.05em; }
    .novel-body p { margin-bottom: 1.6em; text-indent: 1em; }
    .novel-body p.no-indent { text-indent: 0; }
    .novel-body .preview-box {
      margin-top: 35px;
      padding: 18px;
      background: rgba(201, 42, 42, 0.05);
      border-left: 3px solid var(--accent-red);
      font-size: 0.9rem;
      color: #bbb;
      text-indent: 0;
    }
    .lyrics-body {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 25px 16px;
      font-size: 1rem;
      line-height: 2.2;
      white-space: pre-wrap;
      color: #ccc;
      text-align: center;
    }
    .bottom-section {
      margin-top: 45px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .btn-return-toc {
      background: var(--panel-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: sans-serif;
      font-weight: bold;
    }
    .link-list-card {
      margin-top: 25px;
      background: #111116;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px;
      text-align: left;
      font-family: sans-serif;
    }
    .link-list-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .link-item-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #bbb;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .link-item-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #1d1d28;
    }
    .link-item-btn.current {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: #1f1a1e;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100vh;
      background: #121218;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--accent-gold);
      font-family: sans-serif;
    }
    .toc-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px 0; font-family: sans-serif; }
    .toc-item {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .toc-item.active { background: var(--panel-bg); color: var(--accent-gold); border-left: 3px solid var(--accent-gold); }
    .toc-vol-title { font-size: 0.75rem; color: var(--accent-red); font-weight: bold; padding: 15px 20px 5px; }
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; z-index: 150; }
    .overlay.open { display: block; }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 17, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      z-index: 90;
    }
    .nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" onclick="loadChapter(0)">SHADOWS SAGA</div>
    <div class="header-controls">
      <button class="btn-icon" onclick="toggleFontSize()">文字: <span id="font-size-label">中</span></button>
      <button class="btn-icon" onclick="toggleSidebar()">目次 ☰</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>目次一覧</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>

  <main>
    <div class="chapter-header">
      <div class="volume-tag" id="vol-tag">SHADOWS SAGA</div>
      <h1 class="chapter-title" id="chapter-title">目次</h1>
    </div>

    <div class="audio-card">
      <div class="audio-info">
        <div class="audio-title-wrap">
          <span class="audio-badge">BGM</span>
          <span class="audio-song-name" id="song-name">曲名</span>
        </div>
        <span class="no-audio-msg" id="audio-status"></span>
      </div>
      <audio id="audio-player" controls preload="metadata" src=""></audio>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tab-book" onclick="switchView('book')">📖 小説 (Book)</button>
      <button class="tab-btn" id="tab-lyric" onclick="switchView('lyric')">📜 歌詞 (Lyric)</button>
    </div>

    <div class="view-content active" id="content-book">
      <article class="novel-body" id="novel-text"></article>
      <div class="link-list-card" id="top-chapter-portal" style="display: none;">
        <div class="link-list-header">📖 章一覧（タップで直接読む）</div>
        <div class="link-grid" id="chapter-grid"></div>
      </div>
      <div class="bottom-section" id="book-footer">
        <button class="btn-return-toc" onclick="loadChapter(0)">📑 もくじ（トップ）に戻る</button>
      </div>
    </div>

    <div class="view-content" id="content-lyric">
      <div class="lyrics-body" id="lyrics-text"></div>
      <div class="link-list-card">
        <div class="link-list-header" style="color: var(--accent-red);">💿 収録曲リスト（タップで移動）</div>
        <div class="link-grid" id="track-grid"></div>
      </div>
    </div>
  </main>

  <div class="footer-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevChapter()">← 前の章</button>
    <button class="nav-btn" id="next-btn" onclick="nextChapter()">次の章 →</button>
  </div>

  <script>
    const chapters = [
      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "第1巻 もくじ・プロローグ",
        song: "Dawn Beyond Shadows (OP#)",
        mp3: "https://files.catbox.moe/00u2y7.mp3",
        lyrics: `灰の中から目覚め 鎖を断ち切れ\n炎の中で 運命を刻む\n闇の彼方から 呼ぶ声が\n導くんだ Dawn Beyond Shadows\n\nもう恐れない 痛みさえも\n嵐を超えて We rise again\n\nDawn beyond shadows, 燃え上がれ\n闇を裂き 未来を掴め\n声を上げて 信じる限り\nThis is our destiny！`,
        content: `
          <p class="no-indent" style="text-align: center; color: var(--accent-gold); font-weight: bold; margin-bottom: 2em; font-size: 1.15rem; line-height: 2.2;">
            抗い続ける者たちへ…<br>
            …光を信じ、闇を裂け！<br>
            闇の彼方に暁は訪れる<br>
            ──その手で掴め、未来を！<br><br>
            Dawn Beyond Shadows<br>
            ～暁の彼方へ～

      {

        mp3: "",
        lyrics: `"Once, melodies ruled the sky...\nNow, shadows choke the final note...\nBut in the ruins─a spark screams!!"\n\n錆びたオルゴール 針は止まった\n闇に奪われた 調べの翼\nDon't fade... 震える旋律\n灰の中の Emberの灯火\n\n燃え上がれ!、Ember!\nBreak the chains! 紅蓮のStage\n沈黙を切り裂く 歌のヤイバ`,
        content: `
          <p>かつて、世界は「光」と呼ばれるエネルギーで満ち、人々は音楽と共に平和に暮らしていた。だが、その均衡は突如として崩れた。</p>
          <p>——影の勢力——<br>光を憎み、世界を闇で覆い尽くそうとする者たち。街は廃墟と化し、音楽は静寂に呑み込まれた。</p>
          <p>しかし、闇に抗う歌の戦士「BABYMETAL」——スーメタル、モアメタル、ユイメタルがいた。彼女たちを支えるマークメタルと小型AI「すぅちゃん」。だが影の支配者ルマンドX、響、紅白、そして冷徹なサヤメタ率いるメタル四天王が立ちはだかる。</p>
          <div class="preview-box">次回、第2話『交戦』。荒廃した都市で激突！ 君は、刻の涙を見る。</div>
        `
      },
      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "2# 交戦",
        song: "Light of Resistance",
        mp3: "",
        lyrics: `Stand and fight, warriors of light!\nBurning bright, we’ll end the night!\nRaise your voice for the light of resistance!\n闇を越え、新たな時代へ\nRaise your blade for the light of resistance!\n絆を胸に、勝利を掴め！`,
        content: `
          <p>廃墟の都市。「影の勢力が集結している……ここが正念場だな。」マークメタルが蛍丸に手を掛ける。「やるっきゃないね！」モアメタルが拳を握る。「ええ……負けるわけにはいかない。」スーメタルが頷いた。</p>
          <p>スーメタルの光の波動、モアとユイの連撃、そしてマークの蛍丸の一閃が影の軍勢を薙ぎ払う！ だが四天王との決戦はまだこれからだった。</p>
          <div class="preview-box">モアメタルDEATH🤘。第3話『脅威』！ プッチャキツネアーップ！🤘🤘アーーーーッ！</div>
        `
      },
      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "3# 脅威",
        song: "Unstoppable Darkness",
        mp3: "",
        lyrics: `影が伸びる 逃げ場のない世界\n足元を裂く 暗闇の調べ\n光を嘲笑う 黒い爪\nWe are the shadow, ruling the night\nUnstoppable force, extinguishing light`,
        content: `
          <p>暗闇の中蠢くメタル四天王。不協和音の支配者・ルマンドX、剛腕の破壊神・響メタル、二本の扇で舞う紅白メタル、そして黒い折り紙兵器「影折」を操る沈黙の暗殺者サヤメタ。その刃が音もなく忍び寄る。</p>
          <div class="preview-box">次回、第4話 『紅白』ぅ～「お前はもう、踊らされている——！」</div>
        `
      },
      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "4# 紅白",
        song: "緋色の決戦 ~紅白メタル~",
        mp3: "",
        lyrics: `「最強で最高な…俺の才能だ！」\n踊る刃 風を裂く 扇が誘う赤と白の舞\n運命すらも 俺の掌\nScarlet Showdown！\n「絶対と絶命で…己を試せ」`,
        content: `
          <p>優雅に扇を操る紅白メタル。「最強で最高な、俺の才能だ。」だがBABYMETALも踊る戦士。モアとユイが舞のリズムをトレースして隙を作り、スーメタルの閃光の歌声が貫く！「絶対と絶命で己を試せ……か。」四天王初の敗北。</p>
          <div class="preview-box">オッス！オラ、モアメタル🐨！ 次回は第5話『策略』だ。オラ、ワクワクすっぞ！</div>
        `

        content: `

        lyrics: `"In the silence before dawn, I hear the echoes calling me."\nEchoes, echoes of tomorrow\nWe won’t stop! We won’t fall!\n未来を信じて 今羽ばたく`,

        `

      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "9# 奮起",

        mp3: "",
        lyrics: `壊れた街の 片隅に 残された 小さな声がある\n(If this song can reach you)\nこの歌が もし君に届くなら もう一度だけ 振り向いてほしい\nそれでも光を 信じてるから`,
        content: `

          <div class="preview-box">サヤメタはマークの刀で遊び始めるそうなのだ。見逃したら逮捕なのだ。</div>
        `
      },
      {
        vol: "第1巻：Dawn Beyond Shadows",
        title: "10# 蛍丸",
        song: "影の円舞曲",
        mp3: "https://files.catbox.moe/phvkwp.mp3",
        lyrics: `闇の帳 揺れる灯 影に溶けたこの身を\n無心で振るう 刃の先 迷いを斬れるか\n冷えた刃 鈍く光り 空を裂いて 音が鳴る\n剣の舞 影に溶け ただの器になればいい\nそう思うたび 揺らめくのは この手が知る 熱\n刀を納める 静寂 鞘に消える余韻の音\n問うことすら 赦されぬ 影は揺れながら`,

          <p class="no-indent"><strong>【第2弾 映画化キャスト妄想】</strong><br>モモメタル：本人 ／ のえるメタル：松雪泰子 ／ フラゴドンメタル：天海祐希 ／ ユミックス：大地真央 ／ かいとん。：木村多江</p>
        `
      },

      // --- 外伝 ---
      {
        vol: "外伝：マークメタル覚醒前夜",
        title: "外伝1『蛍丸』",
        song: "Fading Light ~mark-metal~",
        mp3: "",
        lyrics: `君を創った日々が輝いてた だけど闇が僕を飲み込み\n君の声も届かなくなった\nFading light, 消えゆく光 僕を導いてくれた声\n「ありがとう。」`,
        content: `
          <p class="no-indent" style="text-align: center; color: var(--accent-gold); font-weight: bold; margin-bottom: 2em;">
            蛍丸に込められた「守りたい未来」の誓い。<br>
            光の戦士時代、マークメタルが愛した女性研究者・菫の壮絶な最期。<br>
            彼女の魂を封じた蛍丸が、闇に堕ちる瞬間まで輝き続けた本当の理由とは？
          </p>
          <p>若き日のすず香、最愛、由結を厳しく鍛えるマークメタルと、優しく見守る恋人・菫（すみれ）。だがルマンドXの襲撃により菫は致命傷を負う。「私の光と心を残すわ……」彼女は魂を蛍丸とAIすぅちゃんに宿した。</p>
          <p>数年後、罠に落ちたマークメタル。蛍丸が光を放ち続けたのは、彼を身代わりとなって守り続けるためだった。死の瞬間、刀の魂はすぅちゃんへ移り、蛍丸は光を失う。マークは影へ堕ちたが、愛の記憶はすぅちゃんの奥底で守られていたのだった。</p>
        `
      },

      // --- 巻末特設 ---
      {
        vol: "巻末特設：アーカイブ",
        title: "徹底批評・考察アーカイブ",
        song: "出没自在。 ~かいとん。~",
        mp3: "",
        lyrics: `街の片隅 ひとり酒 消える呟き 夜の風\nかいとん。かいとん。 何処へ行く 誰も知らない 影の中\n涼しげ顔で 辛麺を 啜りながらも そっと言う\n明日も風へと 消えてゆく`,
        content: `
          <p class="no-indent" style="font-weight: bold; color: var(--accent-gold); font-size: 1.1rem; margin-bottom: 1.5em;">【熱狂的メイト・考察班による総括レビュー】</p>
          <p><strong>① カニの軌跡：</strong><br>第1巻14話のカニダンスから、15話のスーの「なめたらいかんぜよ」、22話のユイ覚醒、30話サヤメタ辞世の句、そして第2巻32話の「カニ折による弦切断」まで。脱力ギャグに見せて最大の絆と伏線回収を果たす奇跡のモチーフ。</p>
          <p><strong>② 出没自在。かいとん。姐さん監視録：</strong><br>珈琲牛乳、柳川鍋、煙草、酒、マティーニ、辛麺と常に各地の美味を満喫しつつ見守る影の守護神。「出没自在。」の歌詞は小説の登場順・完全七五調で作られた職人芸である。</p>
          <p><strong>③ 影折 vs 光折の完全鏡像対比：</strong><br>「黒の華」と「白の炎」、「絶望の果て」と「希望の果て」。同じ「抗うことに意味はない」という影の囁きを光折が打ち砕くアンサーソング構造は、本作の音楽プロデュースの白眉である。</p>
        `
      }
    ];

    let currentIndex = 0;
    const fontSizes = ["0.95rem", "1.05rem", "1.2rem"];
    const fontSizeLabels = ["小", "中", "大"];
    let currentFontSizeIdx = 1;

    function init() {
      try {
        renderToc();
        loadChapter(0);
      } catch (err) {
        console.error(err);
      }
    }

    function renderToc() {
      const tocList = document.getElementById("toc-list");
      tocList.innerHTML = "";
      let currentVol = "";
      chapters.forEach((ch, idx) => {
        if (ch.vol !== currentVol) {
          currentVol = ch.vol;
          const volTitle = document.createElement("li");
          volTitle.className = "toc-vol-title";
          volTitle.innerText = currentVol;
          tocList.appendChild(volTitle);
        }
        const li = document.createElement("li");
        li.className = "toc-item" + (idx === currentIndex ? " active" : "");
        li.innerText = ch.title;
        li.onclick = () => { loadChapter(idx); toggleSidebar(); };
        tocList.appendChild(li);
      });
    }

    function renderTrackGrid() {
      const grid = document.getElementById("track-grid");
      grid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        const btn = document.createElement("div");
        btn.className = "link-item-btn" + (idx === currentIndex ? " current" : "");
        btn.onclick = () => { loadChapter(idx); switchView('lyric'); };
        btn.innerHTML = `<span>🎵 ${ch.song}</span><span style="font-size:0.75rem;color:#888;">${ch.title.split(' ')[0]}</span>`;
        grid.appendChild(btn);
      });
    }

    function renderChapterGrid() {
      const grid = document.getElementById("chapter-grid");
      grid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        if (idx === 0) return;
        const btn = document.createElement("div");
        btn.className = "link-item-btn";
        btn.onclick = () => { loadChapter(idx); switchView('book'); };
        btn.innerHTML = `<span>${ch.title}</span><span style="font-size:0.75rem;color:var(--accent-gold);">読む →</span>`;
        grid.appendChild(btn);
      });
    }

    function loadChapter(index) {
      currentIndex = index;
      const ch = chapters[index];
      document.getElementById("vol-tag").innerText = ch.vol;
      document.getElementById("chapter-title").innerText = ch.title;
      document.getElementById("song-name").innerText = ch.song;
      
      const player = document.getElementById("audio-player");
      const status = document.getElementById("audio-status");
      if (ch.mp3 && ch.mp3.trim() !== "") {
        player.src = ch.mp3;
        player.style.display = "block";
        status.innerText = "";
      } else {
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        status.innerText = "（🎵 音源準備中）";
      }

      document.getElementById("novel-text").innerHTML = ch.content;
      document.getElementById("lyrics-text").innerText = ch.lyrics;

      if (currentIndex === 0) {
        document.getElementById("top-chapter-portal").style.display = "block";
        document.getElementById("book-footer").style.display = "none";
        renderChapterGrid();
      } else {
        document.getElementById("top-chapter-portal").style.display = "none";
        document.getElementById("book-footer").style.display = "block";
      }

      renderTrackGrid();
      switchView('book');

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === chapters.length - 1);
      renderToc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchView(type) {
      document.getElementById("tab-book").classList.toggle("active", type === 'book');
      document.getElementById("tab-lyric").classList.toggle("active", type === 'lyric');
      document.getElementById("content-book").classList.toggle("active", type === 'book');
      document.getElementById("content-lyric").classList.toggle("active", type === 'lyric');
    }

    function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
    function nextChapter() { if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1); }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function toggleFontSize() {
      currentFontSizeIdx = (currentFontSizeIdx + 1) % fontSizes.length;
      document.getElementById("novel-text").style.fontSize = fontSizes[currentFontSizeIdx];
      document.getElementById("font-size-label").innerText = fontSizeLabels[currentFontSizeIdx];
    }

    init();
    </script>
</body>
</html>
